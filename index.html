<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>LIGHT SHIFT</title>

<style>
*{
  box-sizing:border-box;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

#game{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

#scene{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#202020;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#title{
  position:absolute;
  top:18px;
  left:20px;
  pointer-events:none;
}

#title b{
  font-size:28px;
  letter-spacing:5px;
}

#title span{
  display:block;
  margin-top:8px;
  color:#999;
  font-size:14px;
}

/* CLEAR画面 */
#clear{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.88);
  z-index:10;
}

#clear h1{
  font-size:48px;
  letter-spacing:8px;
  margin:0;
}

#clear p{
  color:#aaa;
  font-size:14px;
  margin:15px 0 5px;
}

#clear button{
  margin-top:20px;
  padding:13px 32px;
  font-size:16px;
  color:white;
  background:#222;
  border:1px solid #888;
  border-radius:8px;
}

#controls{
  height:180px;
  background:#111;
  border-top:1px solid #444;
  position:relative;
}

#stick{
  position:absolute;
  left:35px;
  top:27px;
  width:125px;
  height:125px;
  border:2px solid #666;
  border-radius:50%;
  background:#222;
}

#knob{
  position:absolute;
  width:54px;
  height:54px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:#ddd;
}

#lightButton{
  position:absolute;
  right:35px;
  top:27px;
  width:125px;
  height:125px;
  border-radius:50%;
  border:2px solid #888;
  background:#ddd;
  color:#111;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<div id="game">

  <div id="scene">

    <canvas id="canvas"></canvas>

    <div id="title">
      <b>LIGHT SHIFT</b>
      <span>STAGE 01　影をスイッチへ</span>
    </div>

    <div id="clear">

      <h1>CLEAR</h1>

      <p>影がスイッチに重なった</p>

      <button id="restart">
        もう一度
      </button>

    </div>

  </div>

  <div id="controls">

    <div id="stick">
      <div id="knob"></div>
    </div>

    <button id="lightButton">
      LIGHT<br>↻
    </button>

  </div>

</div>


<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;


/* =====================
   サイズ
===================== */

function resize(){

  W = canvas.clientWidth;
  H = canvas.clientHeight;

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  /*
    画面サイズが変わっても
    ゲーム位置を再調整
  */

  if(!gameStarted){
    setup();
  }
}

window.addEventListener(
  "resize",
  resize
);


/* =====================
   オブジェクト
===================== */

const player = {
  x:0,
  y:0
};

const shadow = {
  x:0,
  y:0
};

const target = {
  x:0,
  y:0
};

const light = {
  x:0,
  y:0
};


let cleared = false;
let gameStarted = false;


/* =====================
   初期化
===================== */

function setup(){

  player.x = W * 0.38;
  player.y = H * 0.60;

  /*
    影はプレイヤーより上
  */

  shadow.x = W * 0.78;
  shadow.y = player.y - 120;

  /*
    スイッチ
  */

  target.x = W * 0.78;
  target.y = H * 0.28;

  /*
    ライト
  */

  light.x = W * 0.18;
  light.y = player.y;

  cleared = false;
  gameStarted = true;

  document
    .getElementById("clear")
    .style.display = "none";

  joyY = 0;

  knob.style.transform =
    "translateY(0)";
}


/* =====================
   完全リスタート
===================== */

function restartGame(){

  setup();

}


/* =====================
   ジョイスティック
===================== */

const stick =
  document.getElementById("stick");

const knob =
  document.getElementById("knob");

let active = false;
let joyY = 0;


function moveStick(e){

  const r =
    stick.getBoundingClientRect();

  let y =
    e.clientY -
    (r.top + r.height / 2);

  const max = 45;

  y = Math.max(
    -max,
    Math.min(max,y)
  );

  joyY = y / max;

  knob.style.transform =
    `translateY(${y}px)`;
}


stick.addEventListener(
  "pointerdown",
  e => {

    active = true;

    stick.setPointerCapture(
      e.pointerId
    );

    moveStick(e);
  }
);


stick.addEventListener(
  "pointermove",
  e => {

    if(active){
      moveStick(e);
    }

  }
);


function stopStick(){

  active = false;

  joyY = 0;

  knob.style.transform =
    "translateY(0)";
}


stick.addEventListener(
  "pointerup",
  stopStick
);

stick.addEventListener(
  "pointercancel",
  stopStick
);


/* =====================
   ライトボタン
===================== */

document
  .getElementById("lightButton")
  .addEventListener(
    "pointerdown",
    () => {

      /*
        今回はゲームの基本操作を
        分かりやすくするため、
        ボタンを押しても
        プレイヤー位置は変えない。
      */

    }
  );


/* =====================
   ゲーム更新
===================== */

function update(){

  if(!cleared){

    /*
      上下移動
    */

    player.y += joyY * 4;


    /*
      画面外に出ない
    */

    player.y =
      Math.max(
        90,
        Math.min(
          H - 50,
          player.y
        )
      );


    /*
      ライト連動
    */

    light.y =
      player.y;


    /*
      影連動

      プレイヤーより
      120px上
    */

    shadow.y =
      player.y - 120;


    /*
      影とスイッチの距離
    */

    const distance =
      Math.abs(
        shadow.y -
        target.y
      );


    /*
      クリア判定

      少し余裕を持たせる
    */

    if(distance < 45){

      cleared = true;

      document
        .getElementById("clear")
        .style.display = "flex";

    }

  }


  draw();

  requestAnimationFrame(update);
}


/* =====================
   描画
===================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    背景
  */

  ctx.fillStyle =
    "#202020";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    グリッド
  */

  ctx.strokeStyle =
    "#2d2d2d";

  ctx.lineWidth = 1;


  for(
    let x=0;
    x<W;
    x+=45
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      55
    );

    ctx.lineTo(
      x,
      H
    );

    ctx.stroke();
  }


  for(
    let y=55;
    y<H;
    y+=45
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();
  }


  /*
    光
  */

  const gradient =
    ctx.createRadialGradient(
      light.x,
      light.y,
      5,
      light.x,
      light.y,
      190
    );


  gradient.addColorStop(
    0,
    "rgba(255,255,255,.45)"
  );

  gradient.addColorStop(
    .4,
    "rgba(255,255,255,.12)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );


  ctx.fillStyle =
    gradient;


  ctx.beginPath();

  ctx.arc(
    light.x,
    light.y,
    190,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    スイッチ
  */

  ctx.beginPath();

  ctx.arc(
    target.x,
    target.y,
    32,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ddd";

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    target.x,
    target.y,
    12,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#222";

  ctx.fill();


  /*
    影
  */

  ctx.fillStyle =
    "#000";


  ctx.beginPath();

  ctx.ellipse(
    shadow.x,
    shadow.y,
    32,
    65,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    shadow.x,
    shadow.y - 68,
    22,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    プレイヤー
  */

  ctx.fillStyle =
    "#ddd";


  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y,
    20,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#aaa";


  ctx.fillRect(
    player.x - 13,
    player.y + 17,
    26,
    30
  );


  /*
    ライト本体
  */

  ctx.fillStyle =
    "#fff";


  ctx.beginPath();

  ctx.arc(
    light.x,
    light.y,
    9,
    0,
    Math.PI * 2
  );

  ctx.fill();

}


/* =====================
   再プレイボタン
===================== */

document
  .getElementById("restart")
  .addEventListener(
    "click",
    restartGame
  );


/* =====================
   スタート
===================== */

resize();

setup();

update();

</script>

</body>
</html>
