<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIGHT SHIFT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#eee;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:700px;
  margin:auto;
  overflow:hidden;
  background:#202020;
}

#top{
  height:100px;
  padding:28px 20px 0;
  background:#151515;
  border-bottom:1px solid #333;
}

#title{
  font-size:28px;
  font-weight:bold;
  letter-spacing:7px;
}

#stage{
  margin-top:8px;
  font-size:15px;
  color:#999;
}

#field{
  position:absolute;
  top:100px;
  left:0;
  right:0;
  bottom:280px;
  overflow:hidden;
  background:
    linear-gradient(#292929 1px,transparent 1px),
    linear-gradient(90deg,#292929 1px,transparent 1px);
  background-size:60px 60px;
}

#light{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 35px 15px rgba(255,255,255,.35);
  z-index:5;
}

#player{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#eee;
  z-index:4;
}

#shadow{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#050505;
  z-index:2;
  transition:left .08s,top .08s;
}

#target{
  position:absolute;
  width:78px;
  height:78px;
  border:3px solid #aaa;
  border-radius:50%;
  z-index:1;
}

#target:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:10px;
  height:10px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#aaa;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:280px;
  background:#111;
  border-top:1px solid #333;
}

#stick{
  position:absolute;
  left:45px;
  top:55px;
  width:150px;
  height:150px;
  border:3px solid #666;
  border-radius:50%;
}

#knob{
  position:absolute;
  left:50%;
  top:50%;
  width:65px;
  height:65px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#ddd;
}

#lightBtn{
  position:absolute;
  right:45px;
  top:55px;
  width:150px;
  height:150px;
  border-radius:50%;
  border:3px solid #aaa;
  background:#ddd;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

#lightBtn span{
  display:block;
  font-size:22px;
  margin-top:5px;
}

#restart{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  padding:8px 18px;
  border:1px solid #555;
  border-radius:20px;
  background:#222;
  color:#aaa;
  font-size:13px;
}

#message{
  display:none;
  position:absolute;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.82);
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#message h2{
  font-size:38px;
  letter-spacing:7px;
  margin:0 0 10px;
}

#message p{
  color:#aaa;
  margin:0 0 28px;
  font-size:16px;
}

#next{
  padding:15px 45px;
  border:0;
  border-radius:30px;
  background:#eee;
  color:#111;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

  <div id="top">
    <div id="title">LIGHT SHIFT</div>
    <div id="stage">STAGE 01　影をターゲットへ</div>
  </div>

  <div id="field">
    <div id="light"></div>
    <div id="target"></div>
    <div id="shadow"></div>
    <div id="player"></div>
  </div>

  <div id="controls">

    <div id="stick">
      <div id="knob"></div>
    </div>

    <button id="lightBtn">
      LIGHT
      <span>↻</span>
    </button>

    <button id="restart">RESTART</button>

  </div>

  <div id="message">
    <h2 id="messageText">CLEAR</h2>
    <p>影がターゲットに重なった</p>
    <button id="next">NEXT</button>
  </div>

</div>

<script>

const field=document.getElementById("field");
const player=document.getElementById("player");
const shadow=document.getElementById("shadow");
const light=document.getElementById("light");
const target=document.getElementById("target");

const knob=document.getElementById("knob");
const stick=document.getElementById("stick");
const lightBtn=document.getElementById("lightBtn");
const restart=document.getElementById("restart");

const message=document.getElementById("message");
const messageText=document.getElementById("messageText");
const next=document.getElementById("next");
const stageText=document.getElementById("stage");


/* =========================
   ステージ
========================= */

const stages=[

  {
    player:[0.28,0.50],
    target:[0.78,0.72],
    light:[
      [0.08,0.50],
      [0.92,0.50],
      [0.50,0.10],
      [0.50,0.90]
    ]
  },

  {
    player:[0.50,0.30],
    target:[0.20,0.75],
    light:[
      [0.50,0.05],
      [0.95,0.50],
      [0.50,0.95],
      [0.05,0.50]
    ]
  },

  {
    player:[0.25,0.70],
    target:[0.78,0.25],
    light:[
      [0.05,0.10],
      [0.95,0.10],
      [0.95,0.90],
      [0.05,0.90]
    ]
  }

];


/* =========================
   状態
========================= */

let stage=0;
let lightIndex=0;

let dx=0;
let dy=0;

let dragging=false;

let hasMoved=false;
let hasChangedLight=false;

let cleared=false;


/* =========================
   位置
========================= */

function setPosition(el,x,y){

  el.style.left=(x-el.offsetWidth/2)+"px";
  el.style.top=(y-el.offsetHeight/2)+"px";

}


/* =========================
   ステージ開始
========================= */

function setup(){

  cleared=false;

  hasMoved=false;
  hasChangedLight=false;

  message.style.display="none";

  lightIndex=0;

  const w=field.clientWidth;
  const h=field.clientHeight;

  const s=stages[stage];

  setPosition(
    player,
    w*s.player[0],
    h*s.player[1]
  );

  setPosition(
    target,
    w*s.target[0],
    h*s.target[1]
  );

  setLight();

  updateShadow();

  stageText.textContent=
    "STAGE "+
    String(stage+1).padStart(2,"0")+
    "　影をターゲットへ";

  knob.style.left="50%";
  knob.style.top="50%";

}


/* =========================
   光
========================= */

function setLight(){

  const w=field.clientWidth;
  const h=field.clientHeight;

  const p=stages[stage].light[lightIndex];

  setPosition(
    light,
    w*p[0],
    h*p[1]
  );

}


/* =========================
   影
========================= */

function updateShadow(){

  const px=
    player.offsetLeft+
    player.offsetWidth/2;

  const py=
    player.offsetTop+
    player.offsetHeight/2;

  const lx=
    light.offsetLeft+
    light.offsetWidth/2;

  const ly=
    light.offsetTop+
    light.offsetHeight/2;


  let vx=px-lx;
  let vy=py-ly;

  const len=Math.sqrt(vx*vx+vy*vy)||1;

  vx/=len;
  vy/=len;


  /*
    光と反対側へ影を伸ばす
  */

  const distance=150;

  let sx=px+vx*distance;
  let sy=py+vy*distance;


  sx=Math.max(
    30,
    Math.min(field.clientWidth-30,sx)
  );

  sy=Math.max(
    30,
    Math.min(field.clientHeight-30,sy)
  );


  setPosition(shadow,sx,sy);


  checkClear();

}


/* =========================
   クリア判定
========================= */

function checkClear(){

  if(cleared)return;

  /*
    開始直後は絶対にクリアさせない
  */

  if(!hasMoved && !hasChangedLight)return;


  const sx=
    shadow.offsetLeft+
    shadow.offsetWidth/2;

  const sy=
    shadow.offsetTop+
    shadow.offsetHeight/2;


  const tx=
    target.offsetLeft+
    target.offsetWidth/2;

  const ty=
    target.offsetTop+
    target.offsetHeight/2;


  const distance=
    Math.hypot(sx-tx,sy-ty);


  /*
    影の中心がターゲット中心に
    38px以内ならクリア
  */

  if(distance<38){

    cleared=true;

    if(stage===stages.length-1){

      messageText.textContent="ALL CLEAR";
      next.textContent="PLAY AGAIN";

    }else{

      messageText.textContent="CLEAR";
      next.textContent="NEXT";

    }

    message.style.display="flex";

  }

}


/* =========================
   プレイヤー移動
========================= */

function movePlayer(){

  if(!cleared){

    const speed=3.5;

    let x=
      player.offsetLeft+
      dx*speed;

    let y=
      player.offsetTop+
      dy*speed;


    x=Math.max(
      5,
      Math.min(
        field.clientWidth-player.offsetWidth-5,
        x
      )
    );

    y=Math.max(
      5,
      Math.min(
        field.clientHeight-player.offsetHeight-5,
        y
      )
    );


    if(dx!==0 || dy!==0){

      hasMoved=true;

    }


    player.style.left=x+"px";
    player.style.top=y+"px";


    updateShadow();

  }


  requestAnimationFrame(movePlayer);

}


/* =========================
   ジョイスティック
========================= */

function setStick(e){

  const r=stick.getBoundingClientRect();

  let x=
    e.clientX-
    r.left-
    r.width/2;

  let y=
    e.clientY-
    r.top-
    r.height/2;


  const max=55;

  const len=Math.hypot(x,y);

  if(len>max){

    x=x/len*max;
    y=y/len*max;

  }


  dx=x/max;
  dy=y/max;


  knob.style.left=
    (50+x/r.width*100)+"%";

  knob.style.top=
    (50+y/r.height*100)+"%";

}


stick.addEventListener(
  "pointerdown",
  e=>{

    dragging=true;

    stick.setPointerCapture(e.pointerId);

    setStick(e);

  }
);


stick.addEventListener(
  "pointermove",
  e=>{

    if(dragging){

      setStick(e);

    }

  }
);


function stopStick(){

  dragging=false;

  dx=0;
  dy=0;

  knob.style.left="50%";
  knob.style.top="50%";

}


stick.addEventListener(
  "pointerup",
  stopStick
);

stick.addEventListener(
  "pointercancel",
  stopStick
);


/* =========================
   LIGHTボタン
========================= */

lightBtn.addEventListener(
  "click",
  ()=>{

    if(cleared)return;

    hasChangedLight=true;

    lightIndex++;

    if(
      lightIndex>=
      stages[stage].light.length
    ){

      lightIndex=0;

    }

    setLight();

    updateShadow();

  }
);


/* =========================
   RESTART
========================= */

restart.addEventListener(
  "click",
  ()=>{

    setup();

  }
);


/* =========================
   NEXT
========================= */

next.addEventListener(
  "click",
  ()=>{

    if(
      stage===
      stages.length-1
    ){

      stage=0;

    }else{

      stage++;

    }

    setup();

  }
);


/* =========================
   画面サイズ変更
========================= */

window.addEventListener(
  "resize",
  ()=>{
    setup();
  }
);


/* =========================
   START
========================= */

setup();
movePlayer();

</script>

</body>
</html>
